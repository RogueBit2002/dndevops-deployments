apiVersion: apps/v1
kind: Deployment
metadata:
  name: dndevops-frontend
  namespace: dndevops
  labels:
    app: dndevops-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dndevops-frontend
  template:
    metadata:
      labels:
        app: dndevops-frontend
    spec:
      containers:
        - name: dndevops-frontend
          image: ghcr.io/roguebit2002/dndevops:0.0.1-dev
          ports:
            - containerPort: 8000
          env:
            - name: DNDEVOPS_DEPLOYMENT
              value: frontend